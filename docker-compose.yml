services:
 backend:
   build: ./backend
   image: mdfaizancode/letsmeet-backend
   ports:
    - "5000:5000"
   environment:
    - PORT=5000
   env_file:
    - ./backend/.env


 frontend:
   build: ./frontend
   image: mdfaizancode/letsmeet-frontend
   ports: 
    - "3000:3000"
   depends_on:
      - backend




